services:
  docmost:
    image: docmost/docmost:latest
    depends_on:
      - db
      - redis
    environment:
      APP_URL: "https://workspaces.lurking.site"
      APP_SECRET: "9769991c3a58f18aea7a1ae9e548d974a36eb7f4cbbf78e089dc76453f6bf283"
      DATABASE_URL: "postgresql://docmost:STRONG_DB_PASSWORD@db:5432/docmost?schema=public"
      REDIS_URL: "redis://redis:6379"
      MAIL_DRIVER: "smtp"
      SMTP_HOST: "172.20.0.4"
      SMTP_PORT: 587
      SMTP_USERNAME: "Docmost@internal.lurking.site"
      SMTP_PASSWORD: "ooMMen,;,93"
      SMTP_SECURE: false
      MAIL_FROM_ADDRESS: "Docmost@internal.lurking.site"
      MAIL_FROM_NAME: "Docmost Server"
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - docmost:/app/data/storage

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docmost
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: STRONG_DB_PASSWORD
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  docmost:
  db_data:
  redis_data:
