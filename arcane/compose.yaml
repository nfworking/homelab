      - PGID=1000
      - ENCRYPTION_KEY=9769991c3a58f18aea7a1ae9e548d974a36eb7f4cbbf78e089dc76453f6bf283
      - JWT_SECRET=9769991c3a58f18aea7a1ae9e548d974a36eb7f4cbbf78e089dc76453f6bf283
