- hosts: lxc_containers
  become: true
  tasks:
    - name: Ensure .ssh directory exists
      file:
        path: /root/.ssh
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Copy SSH private key
      copy:
        src: /root/id_rsa
        dest: /root/.ssh/id_rsa
        owner: root
        group: root
        mode: '0600'